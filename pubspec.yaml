name: birdsong_app
description: "Birdsong for iPhone, iPad, Mac and Android: the plate of 1800s bird illustrations, fed by your BirdNET-Go station or by BirdNET running on the device. Test build."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ONNX Runtime for the bird models. Pinned to the release BirdNET Live ships
  # (it carries the session config key that turns off the Arm KleidiAI kernels,
  # see lib/engine/classifier.dart).
  flutter_onnxruntime: 1.9.0

  # Microphone as a stream of 16-bit PCM.
  record: ^7.1.2

  # The plate itself: Birdsong's own index.html in a native web view.
  webview_flutter: ^4.13.0
  url_launcher: ^6.3.1
  plate_share:
    path: packages/plate_share

  # Playing a bird's recordings on the Flutter plate's card, sharing the
  # audio session with the recorder (lib/native/bird_card.dart).
  audioplayers: ^6.4.0

  # The walk on a map on the Flutter plate (lib/native/walk_map.dart):
  # flutter_map, with the paper style drawn from OpenFreeMap's vector tiles.
  flutter_map: ^8.2.0
  flutter_map_vector_tiles: ^2.12.0
  latlong2: ^0.9.1

  # Where models, detections and recordings live.
  path_provider: ^2.1.5

  # Where each listening session happened.
  geolocator: ^14.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/web/
    - assets/web/fonts/
    - assets/app/
    - assets/places/

  # The plate's typeface, so the app's own screens match it.
  # IM Fell English by Igino Marini, SIL Open Font Licence.
  fonts:
    - family: IM Fell English
      fonts:
        - asset: assets/web/fonts/IMFeENrm28P.ttf
        - asset: assets/web/fonts/IMFeENit28P.ttf
          style: italic
    - family: IM Fell English SC
      fonts:
        - asset: assets/web/fonts/IMFeENsc28P.ttf
